name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install GTK and Cairo development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libgtk-4-dev libcairo2-dev

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Package binaries
        id: package
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          mkdir -p dist/paperseal
          install -m 0755 target/release/paperseal dist/paperseal/
          install -m 0755 target/release/paperseal-cli dist/paperseal/
          install -m 0644 README.md dist/paperseal/

          archive="paperseal-linux-x86_64-${RELEASE_TAG}.tar.gz"
          tar -C dist -czf "dist/${archive}" paperseal
          sha256sum "dist/${archive}" > "dist/${archive}.sha256"

          echo "archive=dist/${archive}" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${archive}.sha256" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi

      - name: Upload release archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.checksum }}" \
            --clobber